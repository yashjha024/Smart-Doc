<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FileCraft</title>
    <style>
      /* Prevent unstyled flash before Vite loads CSS */
      html, body { margin: 0; background-color: #f8fafc; }
      html[data-theme='dark'], html[data-theme='dark'] body { background-color: #09090f; }
    </style>
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('theme');
          if (theme === 'dark' || (!theme)) {
            document.documentElement.setAttribute('data-theme', 'dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
