<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FileCraft</title>
    <style>
      /* Match theme.css --background so there is no flash before Vite loads CSS */
      html, body { margin: 0; background-color: #F7F4EF; }
      html.dark, html.dark body { background-color: #111110; }
    </style>
    <script>
      // Apply the saved theme (or the system preference) before first paint.
      // Keep in sync with toggleTheme in src/App.tsx.
      (function () {
        try {
          var stored = localStorage.getItem('fc-theme');
          var dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
